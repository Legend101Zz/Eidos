[project]
name = "eidos-pyglove"
version = "0.1.0"
description = "Eidos PyGlove adapter: pinned transform and search-space adapter for PyGlove symbolic objects (worker side only; never installs or upgrades torch)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is deliberately not declared: like eidos-pytorch this package never installs or upgrades
# torch. The researcher's project environment supplies it.
dependencies = ["pyglove>=0.4.5,<0.5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidos_pyglove"]

[tool.pytest.ini_options]
# own config root so the repository-level pytest settings (asyncio plugin options) do not apply
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py39"
line-length = 110

[tool.ruff.lint]
extend-ignore = ["UP006", "UP007", "UP035", "UP045", "SIM105", "B904"]
