[project]
name = "eidos-composer"
version = "0.1.0"
description = "Eidos composer (optional worker-side adapter: MosaicML Composer trainer events as Eidos training-extension phases; never installs or upgrades torch)"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["eidos-pytorch>=1.1,<2", "mosaicml>=0.32.1,<0.33"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidos_composer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"
line-length = 110
