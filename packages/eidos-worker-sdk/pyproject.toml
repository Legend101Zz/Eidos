[project]
name = "eidos-worker-sdk"
version = "1.0.0"
description = "Eidos worker-sdk (standard library only; never installs or upgrades torch)"
requires-python = ">=3.9"
dependencies = ["eidos-wire>=1,<2"]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidos_worker"]

[tool.uv.sources]
eidos-wire = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py39"
line-length = 110

[tool.ruff.lint]
extend-ignore = ["UP006", "UP007", "UP035", "UP045", "SIM105", "B904"]
