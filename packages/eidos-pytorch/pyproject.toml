[project]
name = "eidos-pytorch"
version = "1.1.0"
description = "Eidos pytorch (standard library only; never installs or upgrades torch)"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["eidos-worker-sdk>=1,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidos_pytorch"]

[tool.uv.sources]
eidos-worker-sdk = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py39"
line-length = 110

[tool.ruff.lint]
extend-ignore = ["UP006", "UP007", "UP035", "UP045", "SIM105", "B904"]
