<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1258" viewBox="0 0 1200 1258" role="img"><title>Complete local v1 research harness</title><desc>The internal LLM operates the lab. Planner drafts and assessor results return to the command service, the single logical ledger writer. Workers stage immutable bytes and submit manifests through its fenced API.</desc><defs><marker id="m245973" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#245973"/></marker><marker id="m166759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#166759"/></marker><marker id="m93602b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#93602b"/></marker><marker id="m193644" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#193644"/></marker></defs><rect x="0" y="0" width="1200" height="1258" rx="10" fill="#fbfcfa" stroke="none" stroke-width="1"/><text x="32" y="45" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#193644" text-anchor="start">A complete research lab on your machine</text><text x="32" y="73" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#425e69" text-anchor="start">Local v1 · managed services · bounded LLM turns · one authoritative scientific write path</text><rect x="24" y="100" width="1152" height="618" rx="12" fill="#f6f9f8" stroke="#d4dfe0" stroke-width="1"/><text x="44" y="124" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#245973" text-anchor="start">LOCAL SUPERVISOR  /  HEALTH · STARTUP · RECOVERY · BACKUP</text><rect x="48" y="148" width="288" height="82" rx="8" fill="#f3f5f6" stroke="#acbbc0" stroke-width="1"/><rec