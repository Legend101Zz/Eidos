[project]
name = "image-project"
version = "0.1.0"
description = "A small image classifier with an exposure audit, used as a second Eidos example"
requires-python = ">=3.9"
dependencies = ["torch"]

[tool.setuptools]
py-modules = ["image_reuse", "pair_report", "eidos_adapter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
